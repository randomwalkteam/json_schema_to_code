[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "json_schema_to_code"
version = "1.1.6"
description = "Generate strongly-typed classes from JSON Schema definitions for Python, C# and Swift"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "François Lagunas", email = "francois.lagunas@gmail.com"}
]
keywords = ["json", "schema", "code", "generation", "python", "csharp", "swift", "dataclass", "template"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing",
    "Intended Audience :: Developers",
]
dependencies = [
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-swift>=0.7.0",
]

[project.scripts]
json_schema_to_code = "json_schema_to_code.json_schema_to_code:json_schema_to_code"

[project.urls]
Homepage = "https://github.com/randomwalkteam/json_schema_to_code"
Repository = "https://github.com/randomwalkteam/json_schema_to_code.git"
Issues = "https://github.com/randomwalkteam/json_schema_to_code/issues"

[tool.setuptools.packages.find]
include = ["json_schema_to_code*"]

[tool.setuptools.package-data]
json_schema_to_code = ["validation_rules_*.json"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
]
ignore = [
    "E501",  # line too long, handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
"json_schema_to_code/tests/test_data/references/*" = [
    "W291",  # trailing whitespace
    "W292",  # no newline at end of file
    "W293",  # blank line contains whitespace
    "E302",  # expected 2 blank lines
    "E303",  # too many blank lines
]
"json_schema_to_code/tests/test_data/test_cases/*/reference.*" = [
    "E501",  # line too long
    "W291",  # trailing whitespace
    "W292",  # no newline at end of file
    "W293",  # blank line contains whitespace
    "E302",  # expected 2 blank lines
    "E303",  # too many blank lines
]

[tool.pytest.ini_options]
testpaths = ["json_schema_to_code/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
# Coverage disabled temporarily due to SSL cert issues
# addopts = "-v --tb=short --cov=json_schema_to_code --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["json_schema_to_code"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"
